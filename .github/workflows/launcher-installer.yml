name: Build MazLauncher Installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'launcher/**'
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'CHANGELOG.md'
      - '.github/workflows/launcher-installer.yml'

permissions:
  contents: write

concurrency:
  group: maz-launcher-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build MazClient cleanly
        shell: pwsh
        run: gradle clean build --stacktrace

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish MazLauncher
        shell: pwsh
        run: |
          dotnet restore launcher/MazLauncher/MazLauncher.csproj
          dotnet publish launcher/MazLauncher/MazLauncher.csproj -c Release -r win-x64 --self-contained true -o launcher/publish

      - name: Bundle exact MazClient JAR
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path launcher/publish/payload | Out-Null

          $modVersionLine = Select-String -Path gradle.properties -Pattern '^mod_version=' | Select-Object -First 1
          if (-not $modVersionLine) { throw 'mod_version was not found.' }
          $modVersion = ($modVersionLine.Line -split '=', 2)[1].Trim()

          $jar = "build/libs/maz-client-$modVersion.jar"
          if (-not (Test-Path $jar)) {
            Write-Host 'Contents of build/libs:'
            Get-ChildItem build/libs -File | ForEach-Object { Write-Host $_.Name $_.Length }
            throw "Expected MazClient JAR was not found: $jar"
          }

          Copy-Item $jar launcher/publish/payload/maz-client.jar -Force
          Get-Item launcher/publish/payload/maz-client.jar | ForEach-Object { Write-Host "Bundled MazClient payload bytes: $($_.Length)" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' launcher/installer/MazLauncher.iss

      - name: Upload MazLauncher installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MazLauncher-Setup
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish public GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $modVersionLine = Select-String -Path gradle.properties -Pattern '^mod_version=' | Select-Object -First 1
          if (-not $modVersionLine) { throw 'mod_version was not found.' }
          $modVersion = ($modVersionLine.Line -split '=', 2)[1].Trim()
          $tag = "v$modVersion"

          $installer = Get-ChildItem dist/*.exe | Select-Object -First 1
          if (-not $installer) { throw 'MazLauncher installer was not built.' }

          $publicName = "MazLauncher-Setup-$modVersion.exe"
          $publicPath = Join-Path dist $publicName
          Copy-Item $installer.FullName $publicPath -Force

          $changelog = Get-Content CHANGELOG.md
          $header = "## $modVersion"
          $start = [Array]::IndexOf($changelog, $header)
          if ($start -lt 0) {
            throw "CHANGELOG.md has no release notes section for $modVersion. Add '## $modVersion' before publishing."
          }

          $end = $changelog.Length
          for ($i = $start + 1; $i -lt $changelog.Length; $i++) {
            if ($changelog[$i] -match '^##\s+') {
              $end = $i
              break
            }
          }

          $bodyLines = @()
          if ($end -gt ($start + 1)) {
            $bodyLines = $changelog[($start + 1)..($end - 1)]
          }

          $body = ($bodyLines -join "`n").Trim()
          if ([string]::IsNullOrWhiteSpace($body)) {
            throw "Release notes for $modVersion are empty in CHANGELOG.md."
          }

          $notesPath = 'dist/release-notes.md'
          @(
            "# MazClient $modVersion",
            "",
            $body,
            "",
            "### Download",
            "Download **$publicName** below to install MazLauncher with MazClient $modVersion."
          ) | Set-Content -Encoding utf8 $notesPath

          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --target $env:GITHUB_SHA `
              --title "MazClient $modVersion" `
              --notes-file $notesPath
          }
          else {
            gh release edit $tag `
              --title "MazClient $modVersion" `
              --notes-file $notesPath
          }

          gh release upload $tag $publicPath --clobber
          Write-Host "Published $tag with $publicName and versioned release notes"
