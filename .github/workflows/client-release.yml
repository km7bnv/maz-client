name: Publish MazClient Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'CHANGELOG.md'
      - '.github/workflows/client-release.yml'

permissions:
  contents: write

concurrency:
  group: mazclient-versioned-release
  cancel-in-progress: true

jobs:
  release-client:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build MazClient
        run: gradle clean build --stacktrace

      - name: Publish versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep '^mod_version=' gradle.properties | head -n1 | cut -d= -f2 | tr -d '\r')"
          if [ -z "$version" ]; then
            echo 'mod_version was not found.' >&2
            exit 1
          fi

          jar="build/libs/maz-client-$version.jar"
          if [ ! -f "$jar" ]; then
            echo "Expected JAR missing: $jar" >&2
            ls -la build/libs || true
            exit 1
          fi

          tag="v$version"
          title="MazClient $version"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; uploading the verified JAR."
            gh release upload "$tag" "$jar" --clobber
          else
            gh release create "$tag" "$jar" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "MazClient $version release. Built and verified by GitHub Actions from commit $GITHUB_SHA. See CHANGELOG.md for full release notes."
          fi

          gh release view "$tag" --json tagName,name,isDraft,isPrerelease,url,assets
