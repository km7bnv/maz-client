name: 1.21.11 Runtime Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [ mc-1.21.11 ]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - '.github/workflows/compat-runtime-smoke.yml'

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Build compatibility client
        run: gradle clean build --stacktrace

      - name: Boot Minecraft 1.21.11 for 45 seconds
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 45s xvfb-run -a gradle runClient --stacktrace > runclient.log 2>&1
          EXIT_CODE=$?
          cat runclient.log
          echo "runClient exit code: $EXIT_CODE"

          # A timeout is expected: a healthy client stays alive until we stop it.
          if [ "$EXIT_CODE" -eq 124 ] || [ "$EXIT_CODE" -eq 143 ]; then
            exit 0
          fi

          exit "$EXIT_CODE"

      - name: Upload runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mazclient-1.21.11-runtime-smoke-logs
          path: |
            runclient.log
            crash-reports/**
            logs/**
          if-no-files-found: warn
