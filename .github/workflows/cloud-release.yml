name: Publish MazLauncher Cloud Channel

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'launcher/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - '.github/workflows/cloud-release.yml'

permissions:
  contents: write

concurrency:
  group: mazlauncher-cloud
  cancel-in-progress: true

jobs:
  publish-cloud:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build MazClient cleanly
        shell: pwsh
        run: gradle clean build --stacktrace

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Generate MazLauncher icon
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File launcher/MazLauncher/generate-icon.ps1

      - name: Publish MazLauncher
        shell: pwsh
        run: |
          dotnet restore launcher/MazLauncher/MazLauncher.csproj
          dotnet publish launcher/MazLauncher/MazLauncher.csproj -c Release -r win-x64 --self-contained true -o cloud-out/launcher

      - name: Smoke test MazLauncher EXE
        shell: pwsh
        run: |
          $exe = Resolve-Path cloud-out/launcher/MazLauncher.exe
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) {
            throw "MazLauncher smoke test failed: process exited early with code $($p.ExitCode)."
          }
          Stop-Process -Id $p.Id -Force
          Write-Host 'MazLauncher stayed alive for the smoke-test window.'

      - name: Prepare cloud payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path cloud-out | Out-Null

          $modVersionLine = Select-String -Path gradle.properties -Pattern '^mod_version=' | Select-Object -First 1
          if (-not $modVersionLine) { throw 'mod_version was not found.' }
          $modVersion = ($modVersionLine.Line -split '=', 2)[1].Trim()

          $jar = "build/libs/maz-client-$modVersion.jar"
          if (-not (Test-Path $jar)) {
            Write-Host 'Contents of build/libs:'
            Get-ChildItem build/libs -File | ForEach-Object { Write-Host $_.Name $_.Length }
            throw "Expected MazClient JAR was not found: $jar"
          }
          Copy-Item $jar cloud-out/maz-client.jar -Force
          $mazSha256 = (Get-FileHash cloud-out/maz-client.jar -Algorithm SHA256).Hash.ToLowerInvariant()

          Compress-Archive -Path cloud-out/launcher/* -DestinationPath cloud-out/MazLauncher-win-x64.zip -Force

          [xml]$project = Get-Content launcher/MazLauncher/MazLauncher.csproj
          $launcherVersion = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($launcherVersion)) { throw 'Launcher version was not found.' }

          @{ mazClientVersion = $modVersion; mazClientSha256 = $mazSha256; launcherVersion = $launcherVersion } |
            ConvertTo-Json -Compress |
            Set-Content -Encoding utf8 cloud-out/latest.json

          Write-Host "Publishing MazClient $modVersion / MazLauncher $launcherVersion"
          Get-Item cloud-out/maz-client.jar | ForEach-Object { Write-Host "MazClient payload bytes: $($_.Length)" }
          Write-Host "MazClient SHA256: $mazSha256"

      - name: Create cloud release if missing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view cloud 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create cloud --title 'MazLauncher Cloud Channel' --notes 'Automatically updated MazLauncher and MazClient cloud channel.' --prerelease
          }

      - name: Upload cloud assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload cloud cloud-out/latest.json cloud-out/maz-client.jar cloud-out/MazLauncher-win-x64.zip --clobber
